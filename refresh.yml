name: Refresh film data

on:
  schedule:
    - cron: "30 3 * * *"   # every night at 03:30 UTC
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  push:
    paths:
      - "catalogue.json"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh films.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "film-night-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json tmdb-ids.json
          git diff --cached --quiet || (git commit -m "Refresh film data" && git push)
